services:
  postgres:
    image: postgres:16-alpine
    container_name: esporfe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: medusa
      POSTGRES_PASSWORD: medusa
      POSTGRES_DB: esporfe
    ports:
      - "5432:5432"
    volumes:
      - esporfe_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medusa -d esporfe"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  esporfe_postgres_data:
